services:
  postgres:
    image: postgres:17
    container_name: travel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_password
      POSTGRES_DB: travel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
   image: redis:7
   container_name: travel_redis
   ports:
    - "6379:6379"

volumes:
  postgres_data: